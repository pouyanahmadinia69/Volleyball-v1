<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جدول والیبال</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="color-scheme" content="light"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="والیبال"><meta name="theme-color" content="#3a9bbd">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
:root{color-scheme:light;--bg:#f6fafc;--card:#fff;--ink:#1d3b47;--mut:#62808c;--pri:#3a9bbd;--acc:#f2b632;--line:#dcebf1;--row:#eef7fb;--bad:#d04a3a;--ok:#2e9e6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:10px;background:var(--pri);color:#fff;padding:14px 16px;font-size:20px;font-weight:700}
nav{display:flex;background:var(--card);border-bottom:2px solid var(--line);position:sticky;top:0;z-index:5}
nav button{flex:1;padding:12px 2px;border:0;background:none;color:var(--mut);font:inherit;font-size:13px;border-bottom:3px solid transparent;margin-bottom:-2px}
nav button.on{color:var(--pri);border-color:var(--acc);font-weight:700}
main{padding:12px;max-width:1600px;width:100%;margin:auto}
section{display:none}section.on{display:block}
h3{margin:14px 0 8px;font-size:16px}
.card{background:var(--card);border-radius:10px;padding:12px;margin-bottom:12px;border:1px solid var(--line)}
.wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line);margin-bottom:10px}
table{border-collapse:collapse;width:100%;min-width:640px;background:var(--card);text-align:center;font-size:14px}
table.w1{min-width:1150px}table.w2{min-width:760px}
th{background:var(--pri);color:#fff;padding:10px 6px;white-space:nowrap;font-size:13px}
td{padding:6px 4px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
tr:nth-child(even) td{background:var(--row)}
td.t{font-weight:700}
td input,td select{width:100%;min-width:70px;padding:6px;font-size:14px}
td.ss{min-width:120px}td.ss input{width:50px;min-width:0;text-align:center;direction:ltr;display:inline-block;margin:0 2px}
input,select,button.b{font:inherit;font-size:16px;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button.b{background:var(--pri);color:#fff;border:0;font-weight:700;font-size:14px;padding:9px 12px}
button.b.o{background:var(--card);color:var(--pri);border:1px solid var(--pri)}
button.d{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:14px;color:var(--ink);min-width:92px}
button.x{background:none;border:0;color:var(--bad);font-size:16px;padding:4px 8px}
.r{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.li:first-child{border:0}.li input[type=text],.li input:not([type]){flex:1;margin-inline-end:8px;min-width:0}
.ok{color:var(--ok);font-weight:700}.no{color:var(--bad);font-weight:700}
.mut{color:var(--mut);font-size:13px;text-align:center;padding:10px}
#modal{position:fixed;inset:0;background:rgba(20,40,50,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.cal{background:var(--card);border-radius:12px;padding:14px;width:100%;max-width:340px;max-height:85vh;overflow:auto}
.ch{display:flex;justify-content:space-between;align-items:center}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0}
.wk span{text-align:center;color:var(--mut);font-size:13px}
.dd{padding:9px 0;border:0;border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.dd.on{background:var(--pri);color:#fff}.dd.td{outline:2px solid var(--acc)}
.sp{display:inline-flex;flex-direction:column;align-items:center}.sp .x{padding:2px 8px;line-height:1;color:var(--pri)}.sp b{font-size:18px}
.tm{display:flex;align-items:center;gap:4px}
.fl{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0}.fl label{color:var(--mut);font-size:14px;min-width:60px}.fl select,.fl input{flex:1;min-width:0}.fl input.sn{width:60px;flex:none;text-align:center}
th,td{border-left:1px solid #d3e3ea}
th:last-child,td:last-child{border-left:0}
.dd:disabled{opacity:.22;text-decoration:line-through}
td{padding:8px 8px}th{padding:10px 8px}
body{padding-left:max(0px,env(safe-area-inset-left));padding-right:max(0px,env(safe-area-inset-right))}
@media(min-width:1000px){table,table.w1,table.w2{min-width:0}main{padding:16px 20px}td,th{font-size:15px}}
@media(max-width:999px) and (min-width:600px){td,th{font-size:13px;padding:6px 5px}}
@media(orientation:landscape) and (max-height:520px){header{padding:6px 14px;font-size:16px}header img{width:26px;height:26px}nav button{padding:7px 2px}main{padding:8px}.cal{max-height:92vh}}
button:disabled{opacity:.4}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#1d3b47;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:30;font-size:14px;max-width:90%}
</style>
</head>
<body>
<header><img src="logo-white.png" width="34" height="34" alt="">جدول مسابقات والیبال</header>
<nav><button data-t="pr" class="on">تمرینات</button><button data-t="mt">برنامه و نتایج</button><button data-t="st">رده‌بندی</button><button data-t="tm">تیم‌ها</button><button data-t="se">تنظیمات</button></nav>
<main>
<section id="pr" class="on"></section><section id="mt"></section><section id="st"></section><section id="tm"></section><section id="se"></section>
</main>
<div id="modal"></div><div id="toast"></div>
<input type="file" id="xf" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
<input type="file" id="jf" accept=".json,application/json" hidden>
<script>
const KEY='volley-v1',$=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const en=s=>String(s??'').replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776).replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632);
const pd=s=>String(s);
const p2=n=>String(n).padStart(2,'0');
/* ---- Jalali ---- */
function g2j(gy,gm,gd){const g=[0,31,59,90,120,151,181,212,243,273,304,334];let jy;if(gy>1600){jy=979;gy-=1600}else{jy=0;gy-=621}
 const g2=gm>2?gy+1:gy;let days=365*gy+~~((g2+3)/4)-~~((g2+99)/100)+~~((g2+399)/400)-80+gd+g[gm-1];
 jy+=33*~~(days/12053);days%=12053;jy+=4*~~(days/1461);days%=1461;if(days>365){jy+=~~((days-1)/365);days=(days-1)%365}
 let jm,jd;if(days<186){jm=1+~~(days/31);jd=1+days%31}else{jm=7+~~((days-186)/30);jd=1+(days-186)%30}return[jy,jm,jd]}
function j2g(jy,jm,jd){jy+=1595;let days=-355668+365*jy+~~(jy/33)*8+~~(((jy%33)+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);
 let gy=400*~~(days/146097);days%=146097;if(days>36524){gy+=100*~~(--days/36524);days%=36524;if(days>=365)days++}
 gy+=4*~~(days/1461);days%=1461;if(days>365){gy+=~~((days-1)/365);days=(days-1)%365}
 let gd=days+1;const s=[0,31,((gy%4==0&&gy%100!=0)||gy%400==0)?29:28,31,30,31,30,31,31,30,31,30,31];let gm;
 for(gm=0;gm<13;gm++){if(gd<=s[gm])break;gd-=s[gm]}return[gy,gm,gd]}
const MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const DN=['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
const parse=s=>{const m=/^(\d{4})\/(\d{2})\/(\d{2})$/.exec(s||'');return m?[+m[1],+m[2],+m[3]]:null};
const fmt=(y,m,d)=>`${y}/${p2(m)}/${p2(d)}`;
const wd=(y,m,d)=>{const g=j2g(y,m,d);return new Date(g[0],g[1]-1,g[2]).getDay()};
const dayName=s=>{const d=parse(s);return d?DN[wd(...d)]:''};
const today=()=>{const n=new Date();return g2j(n.getFullYear(),n.getMonth()+1,n.getDate())};
const mlen=(y,m)=>m<7?31:m<12?30:(g2j(...j2g(y,12,30)).join()===[y,12,30].join()?30:29);
const dkey=s=>{const d=parse(s);return d?d[0]*10000+d[1]*100+d[2]:99999999};
const dcmp=(a,b)=>dkey(a.date)-dkey(b.date);
const ds=()=>{const t=today();return`${t[0]}-${p2(t[1])}-${p2(t[2])}`};
const normDate=s=>{const m=/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/.exec(en(s));return m?fmt(+m[1],+m[2],+m[3]):''};
/* ---- state ---- */
function norm(d){d=d&&typeof d==='object'?d:{};
 d.teams=(d.teams||[]).map(t=>({id:t.id||uid(),name:t.name||'',level:t.level||''}));
 d.matches=(d.matches||[]).map(g=>({id:g.id||uid(),date:g.date||'',order:g.order||'',slot:g.slot||'',a:g.a||'',b:g.b||'',
  s:g.s||[0,1,2].map(i=>g.sets&&g.sets[i]?[g.sets[i][0],g.sets[i][1]]:['',''])}));
 d.practices=(d.practices||[]).map(p=>({id:p.id||uid(),date:p.date||'',teams:p.teams||[],slot:p.slot||'',min:p.min??90,type:p.type||''}));
 d.slots=(d.slots&&d.slots.length?d.slots:[{sh:18,sm:0,eh:19,em:30},{sh:19,sm:30,eh:21,em:0}]).map(s=>({id:s.id||uid(),day:s.day||'',sh:+s.sh||0,sm:+s.sm||0,eh:+s.eh||0,em:+s.em||0}));
 d.pp=Array.isArray(d.pp)?d.pp:[];
 d.need=+d.need||4;return d}
let S;try{S=norm(JSON.parse(localStorage.getItem(KEY)))}catch(e){S=norm({})}
const sortSlots=()=>S.slots.sort((a,b)=>(a.day?WD.indexOf(a.day):99)-(b.day?WD.indexOf(b.day):99)||(a.sh*60+a.sm)-(b.sh*60+b.sm)||(a.eh*60+a.em)-(b.eh*60+b.em));
const save=()=>{try{sortSlots();localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const nm=id=>(S.teams.find(t=>t.id===id)||{name:''}).name;
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3800)}
/* ---- compute ---- */
const num=v=>v===''||v==null||isNaN(+v)?null:+v;
function res(g){const sets=[];g.s.forEach(([x,y])=>{x=num(x);y=num(y);if(x!==null&&y!==null&&x!==y)sets.push([x,y])});
 const sa=sets.filter(s=>s[0]>s[1]).length,sb=sets.length-sa;
 const fin=(sa===2||sb===2)&&g.a&&g.b&&g.a!==g.b;
 return{sets,sa,sb,fin,w:fin?(sa>sb?g.a:g.b):'',st:fin?'نهایی':sets.length?'ناقص':'برگزار نشده'}}
function stats(){const m={},fins=[];S.teams.forEach(t=>m[t.id]={id:t.id,name:t.name,p:0,w:0,l:0,sw:0,sl:0,pw:0,pl:0});
 S.matches.forEach(g=>{const r=res(g),A=m[g.a],B=m[g.b];if(!r.fin||!A||!B)return;fins.push([g,r]);
  r.sets.forEach(([x,y])=>{A.pw+=x;A.pl+=y;B.pw+=y;B.pl+=x});A.sw+=r.sa;A.sl+=r.sb;B.sw+=r.sb;B.sl+=r.sa;A.p++;B.p++;
  if(r.w===g.a){A.w++;B.l++}else{B.w++;A.l++}});
 const arr=Object.values(m);arr.forEach(t=>{t.sr=t.sw?(t.sl?t.sw/t.sl:999):0;t.pr=t.pl?t.pw/t.pl:0;t.done=t.p>=arr.length-1&&arr.length>1});
 const h2h=(a,b)=>{let x=0;fins.forEach(([g,r])=>{const pair=(g.a===a.id&&g.b===b.id)||(g.a===b.id&&g.b===a.id);if(pair){if(r.w===a.id)x++;else x--}});return x};
 const r3=v=>Math.round(v*1000);
 arr.sort((a,b)=>b.w-a.w||r3(b.sr)-r3(a.sr)||r3(b.pr)-r3(a.pr)||h2h(b,a)||a.name.localeCompare(b.name));return arr}
/* ---- render ---- */
const WD=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'],ORD=['اول','دوم','سوم','چهارم'];
const slotLabel=s=>`${s.day?s.day+' ':''}${p2(s.sh)}:${p2(s.sm)}-${p2(s.eh)}:${p2(s.em)}`;
const slotStart=l=>{const m=/(\d+):(\d+)-/.exec(l||'');return m?+m[1]*60+ +m[2]:0};
const nextDay=s=>{const[y,m,d]=parse(s),g=j2g(y,m,d),n=new Date(g[0],g[1]-1,g[2]+1);return fmt(...g2j(n.getFullYear(),n.getMonth()+1,n.getDate()))};
const mkey=g=>dkey(g.date)*100000+slotStart(g.slot)*10+Math.max(0,ORD.indexOf(g.order));
const slotMin=l=>{const m=/(\d+):(\d+)-(\d+):(\d+)$/.exec(l||'');if(!m)return 0;const d=(+m[3]*60+ +m[4])-(+m[1]*60+ +m[2]);return d<0?d+1440:d};
const tOnly=l=>(String(l||'').match(/\d{1,2}:\d{2}-\d{1,2}:\d{2}/)||[l||''])[0];
const slotDays=()=>new Set(S.slots.filter(s=>s.day).map(s=>s.day));
const firstAllowed=d=>{const D=slotDays();if(!D.size||!parse(d))return d;let x=d;for(let i=0;i<14;i++){if(D.has(dayName(x)))return x;x=nextDay(x)}return d};
const slotsFor=date=>{const dn=dayName(date);return S.slots.filter(s=>!dn||!s.day||s.day===dn).map(slotLabel)};
const sOpts=(cur,date)=>{const dn=dayName(date),all=S.slots.map(slotLabel),same=dn?S.slots.filter(s=>!s.day||s.day===dn).map(slotLabel):all,other=all.filter(l=>!same.includes(l)),extra=cur&&!all.includes(cur)?[cur]:[];
 const o=(l,x)=>`<option value="${esc(l)}"${l===cur?' selected':''}>${esc(x)}</option>`;
 return'<option value="">—</option>'+same.map(l=>o(l,dn?tOnly(l):l)).join('')+extra.map(l=>o(l,l)).join('')+(other.length?`<optgroup label="سانس‌های روزهای دیگر (تاریخ خودکار عوض می‌شود)">${other.map(l=>o(l,l)).join('')}</optgroup>`:'')};
function fixSlot(o){const dn=dayName(o.date);if(!dn)return;const ok=slotsFor(o.date);if(!ok.includes(o.slot)){o.slot=ok[0]||'';if('min' in o&&o.slot)o.min=slotMin(o.slot)||o.min}}
const fd=d=>d?`${dayName(d)} ${d}`:'';
const bar=(k,o={})=>`<div class="r">${o.noImp?'':`<button class="b" data-imp="${k}">ورود از اکسل</button>`}<button class="b" data-exp="${k}">خروج اکسل</button>${o.noImp?'':`<button class="b o" data-tpl="${k}">دریافت قالب</button>`}</div>`;
const acts=(k,id)=>`<button class="x" style="color:var(--pri)" data-ed="${k}:${id}" title="ویرایش" style="font-size:20px!important">✎</button><button class="x" data-del="${k}:${id}">✕</button>`;
const tOpts=sel=>'<option value="">—</option>'+S.teams.map(t=>`<option value="${t.id}"${t.id===sel?' selected':''}>${esc(t.name)}</option>`).join('');
const optsOf=(arr,cur)=>arr.map(o=>`<option${o===cur?' selected':''}>${o}</option>`).join('');
const head=(h,g=[])=>`<thead><tr>${h.map((x,i)=>`<th${g.includes(i)?' class="g"':''}>${x}</th>`).join('')}</tr></thead>`;
const stp=(id,f,v)=>`<span class="sp"><button class="x" data-st="${id}:${f}:1">▲</button><b>${p2(v)}</b><button class="x" data-st="${id}:${f}:-1">▼</button></span>`;
function render(){
 sortSlots();
 const sc=[...document.querySelectorAll('.wrap')].map(w=>w.scrollLeft),y=scrollY;
 const st=stats();
 $('st').innerHTML=bar('s',{noImp:1})+`<div class="wrap"><table>${head(['رتبه','تیم','بازی','برد','باخت','ست +','ست −','معدل ست','پوئن +','پوئن −','معدل پوئن','وضعیت'])}<tbody>${st.length?st.map((t,i)=>`<tr><td>${i+1}</td><td class="t">${esc(t.name)}</td><td>${t.p}</td><td>${t.w}</td><td>${t.l}</td><td>${t.sw}</td><td>${t.sl}</td><td>${t.sr.toFixed(3)}</td><td>${t.pw}</td><td>${t.pl}</td><td>${t.pr.toFixed(3)}</td><td>${t.done?'پایان':'در حال برگزاری'}</td></tr>`).join(''):'<tr><td colspan="12">اول تیم‌ها را اضافه کنید</td></tr>'}</tbody></table></div><p class="mut">ترتیب: برد بیشتر ← معدل ست ← معدل پوئن ← نتیجه رودررو</p>`;
 const mrows=S.matches.map((g,i)=>{const r=res(g);
  const set=j=>`<td dir="ltr"${j===0?' class="g"':''}>${g.s[j][0]!==''||g.s[j][1]!==''?esc(g.s[j][0])+' - '+esc(g.s[j][1]):''}</td>`;
  return`<tr><td>${i+1}</td><td dir="ltr">${g.date}</td><td>${dayName(g.date)}</td><td>${g.order}</td><td dir="ltr">${esc(tOnly(g.slot))}</td><td class="t g">${esc(nm(g.a))}</td><td class="t">${esc(nm(g.b))}</td>${set(0)}${set(1)}${set(2)}<td class="g">${r.sets.length?r.sa+' - '+r.sb:''}</td><td>${esc(nm(r.w))}</td><td class="${r.fin?'ok':''}">${!r.fin&&!r.sets.length&&S.pp.some(x=>x.id===g.id)?'تعویق شده':r.st}</td><td class="g">${acts('m',g.id)}</td></tr>`}).join('');
 $('mt').innerHTML=bar('m')+`<div class="wrap"><table class="w1">${head(['بازی','تاریخ','روز','ترتیب','سانس','تیم اول','تیم دوم','ست 1','ست 2','ست 3','ست برده','برنده','وضعیت',''],[5,7,10,13])}<tbody>${mrows||'<tr><td colspan="14">بازی‌ای ثبت نشده</td></tr>'}</tbody></table></div><div class="r"><button class="b" data-add="m">+ بازی جدید</button><button class="b o" data-gen="1">ساخت خودکار برنامه</button></div><p class="mut">برای ثبت نتیجه روی «ویرایش» بزنید. وضعیت وقتی «نهایی» می‌شود که یک تیم 2 ست برده باشد.</p>`;
 const prow=S.practices.map((p,i)=>`<tr><td>${i+1}</td><td dir="ltr">${p.date}</td><td>${dayName(p.date)}</td><td class="t">${esc(p.teams.map(nm).join(' / '))}</td><td>${p.teams.length}</td><td dir="ltr">${esc(tOnly(p.slot))}</td><td>${esc(p.min)}</td><td>${esc(p.type)}</td><td>${acts('p',p.id)}</td></tr>`).join('');

  return`<tr><td class="t">${esc(t.name)}</td><td>${esc(t.level)}</td><td>${ps.map(p=>`<div>${fd(p.date)}</div>`).join('')}</td><td>${n}</td><td class="${n===S.need?'ok':'no'}">${n===S.need?'✓ تأیید':n<S.need?'ناقص ('+(S.need-n)+' کم)':'اضافه ('+(n-S.need)+' بیشتر)'}</td></tr>`}).join('');

function genSchedule(start,per,replace){
 const slots=S.slots.filter(s=>s.day).sort((a,b)=>WD.indexOf(a.day)-WD.indexOf(b.day)||(a.sh*60+a.sm)-(b.sh*60+b.sm));
 if(!slots.length){toast('اول در تنظیمات برای سانس‌ها روز هفته مشخص کنید');return false}
 if(S.teams.length<2){toast('حداقل 2 تیم لازم است');return false}
 if(replace)S.matches=[];
 const key=(a,b)=>[a,b].sort().join('|'),have=new Set(S.matches.map(g=>key(g.a,g.b))),pairs=[];
 S.teams.forEach((a,i)=>S.teams.slice(i+1).forEach(b=>{if(!have.has(key(a.id,b.id)))pairs.push([a.id,b.id])}));
 if(!pairs.length){toast('همه‌ی بازی‌ها قبلاً در برنامه هست');return false}
 const played={},last={};S.teams.forEach(t=>{played[t.id]=0;last[t.id]=-1});
 S.matches.forEach(g=>{if(played[g.a]!=null)played[g.a]++;if(played[g.b]!=null)played[g.b]++});
 let date=parse(start)?start:fmt(...today()),sess=0,guard=0,made=0;
 while(pairs.length&&guard++<900){
  const dn=dayName(date);
  slots.filter(s=>s.day===dn).forEach(s=>{if(!pairs.length)return;
   const lbl=slotLabel(s),ex=S.matches.filter(g=>g.date===date&&g.slot===lbl),busy=new Set();
   ex.forEach(g=>{busy.add(g.a);busy.add(g.b)});
   for(let k=ex.length;k<per&&pairs.length;k++){let best=-1,bs=1e12;
    pairs.forEach((p,i)=>{if(busy.has(p[0])||busy.has(p[1]))return;const sc=(played[p[0]]+played[p[1]])*1000+last[p[0]]+last[p[1]];if(sc<bs){bs=sc;best=i}});
    if(best<0)break;
    const p=pairs.splice(best,1)[0];busy.add(p[0]);busy.add(p[1]);
    S.matches.push({id:uid(),date,order:ORD[k]||'',slot:lbl,a:p[0],b:p[1],s:[['',''],['',''],['','']]});
    played[p[0]]++;played[p[1]]++;last[p[0]]=sess;last[p[1]]=sess;made++}
   sess++});
  date=nextDay(date)}
 S.matches.sort((a,b)=>mkey(a)-mkey(b));save();
 toast(made+' بازی در برنامه قرار گرفت'+(pairs.length?` (${pairs.length} بازی جا نشد)`:''));return true}

  <div class="fl"><label>شروع از</label><button class="d" data-gd="1">${fd(start)}</button></div>

  ${S.matches.length?`<label class="fl"><span>پاک شدن برنامه فعلی (با نتایج) و ساخت مجدد</span><input type="checkbox" id="gr"${rep?' checked':''} style="flex:none"></label><p class="mut">اگر تیک نزنید، فقط بازی‌هایی که هنوز در برنامه نیستند اضافه می‌شوند.</p>`:''}

function nextSess(date,lbl){const sl=S.slots.filter(s=>s.day);let d=date,st=slotStart(lbl),first=true;
 for(let n=0;n<400;n++){const dn=dayName(d),c=sl.find(s=>s.day===dn&&(!first||s.sh*60+s.sm>st));if(c)return{date:d,slot:slotLabel(c)};d=nextDay(d);first=false}return null}
function postpone(id){
 const L=S.matches.slice().sort((a,b)=>mkey(a)-mkey(b)),X=L.find(g=>g.id===id);if(!X)return false;
 const free=g=>res(g).st==='برگزار نشده',sk=g=>g.date+'|'+g.slot;
 if(!free(X)){toast('این بازی نتیجه دارد و قابل تعویق نیست');return false}
 const cnt={};L.forEach(g=>cnt[sk(g)]=(cnt[sk(g)]||0)+1);
 const per=Math.min(ORD.length,Math.max(1,...Object.values(cnt)));
 const after=L.filter(g=>g.id!==id&&free(g)&&mkey(g)>mkey(X)&&sk(g)!==sk(X));
 const chain=[X,...after],ids=new Set(chain.map(g=>g.id)),pk=p=>p.date+'|'+p.slot+'|'+p.order;
 const occ=new Set(L.filter(g=>!ids.has(g.id)).map(g=>pk(g)));
 const first=p=>{const n=nextSess(p.date,p.slot);return n?{...n,order:ORD[0]}:null};
 const nextPos=p=>{const i=ORD.indexOf(p.order);return i>=0&&i<per-1?{date:p.date,slot:p.slot,order:ORD[i+1]}:first(p)};
 const P=after.map(g=>({date:g.date,slot:g.slot,order:g.order}));
 let np=after.length?nextPos(P[P.length-1]):first(X),guard=0;
 while(np&&occ.has(pk(np))&&guard++<50)np=nextPos(np);
 if(!np){toast('سانس خالی بعدی پیدا نشد؛ در تنظیمات سانس اضافه کنید');return false}
 P.push(np);
 S.pp.push({id,snap:S.matches.map(g=>[g.id,g.date,g.slot,g.order])});
 chain.forEach((g,k)=>{g.date=P[k].date;g.slot=P[k].slot;g.order=P[k].order});
 S.matches.sort((a,b)=>mkey(a)-mkey(b));save();
 toast('بازی به '+fd(X.date)+' ('+X.order+') منتقل شد و بازی‌های بعدی یک جایگاه عقب رفتند');return true}
function undoPP(id){let i=-1;S.pp.forEach((e,k)=>{if(e.id===id)i=k});if(i<0){toast('چیزی برای برگشت نیست');return false}

 S.pp.length=i;S.matches.sort((a,b)=>mkey(a)-mkey(b));save();toast('برنامه به حالت قبل از تعویق برگشت');return true}

 if(k==='s')return[{n:'رده‌بندی',h:['رتبه','تیم','بازی','برد','باخت','ست +','ست −','معدل ست','پوئن +','پوئن −','معدل پوئن'],r:stats().map((t,i)=>[i+1,t.name,t.p,t.w,t.l,t.sw,t.sl,+t.sr.toFixed(3),t.pw,t.pl,+t.pr.toFixed(3)])}]}
const exSlot=()=>S.slots[0]?slotLabel(S.slots[0]):'19:30-21:00';
const TPL={t:()=>[['STORM','حرفه‌ای']],m:()=>[['1405/08/23','اول',exSlot(),'NWG','STORM',25,22,10,25,16,14]],p:()=>[['1405/08/02','STORM / topgun',exSlot(),90,'حرفه‌ای']]};
function xl(list,fn){if(typeof XLSX==='undefined'){toast('کتابخانه اکسل بارگذاری نشده؛ یک بار با اینترنت باز کنید');return}
 const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};
 list.forEach(s=>{const ws=XLSX.utils.aoa_to_sheet([s.h,...s.r]);ws['!cols']=s.h.map(()=>({wch:20}));XLSX.utils.book_append_sheet(wb,ws,s.n)});
 saveFile(new File([XLSX.write(wb,{bookType:'xlsx',type:'array'})],fn,{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}))}
const mapSlot=(l,date)=>{if(!l)return'';const ls=S.slots.map(slotLabel);if(ls.includes(l))return l;const dn=dayName(date),c=S.slots.filter(s=>(!dn||!s.day||s.day===dn)&&tOnly(slotLabel(s))===tOnly(l))[0];return c?slotLabel(c):l};
const tid=n=>{n=String(n).trim();if(!n)return'';let t=S.teams.find(x=>x.name.toLowerCase()===n.toLowerCase());if(!t){t={id:uid(),name:n,level:''};S.teams.push(t)}return t.id};
function importX(k,file){if(typeof XLSX==='undefined'){toast('کتابخانه اکسل بارگذاری نشده؛ یک بار با اینترنت باز کنید');return}
 const fr=new FileReader();fr.onload=()=>{try{
  const wb=XLSX.read(fr.result,{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
  const hd=(rows[0]||[]).map(nz),ix=COL[k].map(c=>hd.indexOf(nz(c)));
  if(ix.some(i=>i<0))throw 0;
  const data=rows.slice(1).filter(r=>r.some(c=>String(c).trim()!=='')),g=(r,i)=>String(r[ix[i]]??'').trim();
  if(k==='t')data.forEach(r=>{const id=tid(g(r,0));if(id)S.teams.find(t=>t.id===id).level=g(r,1)});
  if(k==='m'){S.pp=[];S.matches=data.map(r=>({id:uid(),date:normDate(g(r,0)),order:g(r,1),slot:mapSlot(g(r,2),normDate(g(r,0))),a:tid(g(r,3)),b:tid(g(r,4)),s:[[5,6],[7,8],[9,10]].map(([a,b])=>[en(g(r,a)),en(g(r,b))])}))}
  if(k==='p')S.practices=data.map(r=>({id:uid(),date:normDate(g(r,0)),teams:g(r,1).split(/\s*[\/،,؛;]\s*/).map(tid).filter(Boolean),slot:mapSlot(g(r,2),normDate(g(r,0))),min:+en(g(r,3))||90,type:g(r,4)})).sort(dcmp);
  save();render();toast('ورود اطلاعات انجام شد ('+data.length+' ردیف)')}catch(e){toast('فایل با قالب جور نیست؛ «دریافت قالب» را بزنید')}};
 fr.readAsArrayBuffer(file)}
function commitSlots(){const old=new Map(S.slots.map(s=>[s.id,slotLabel(s)])),map=new Map();
 SDR.forEach(s=>{const o=old.get(s.id),n=slotLabel(s);if(o!==undefined&&o!==n)map.set(o,n)});
 S.matches.forEach(g=>{if(map.has(g.slot))g.slot=map.get(g.slot)});S.practices.forEach(p=>{if(map.has(p.slot))p.slot=map.get(p.slot)});
 S.slots=SDR;SDR=null;save();render();toast('سانس‌ها ذخیره شد')}
/* ---- events ---- */
let impK='';
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,section').forEach(e=>e.classList.remove('on'));b.classList.add('on');$(b.dataset.t).classList.add('on')});
document.addEventListener('click',e=>{
 const mo=$('modal');if(mo.contains(e.target)){if(e.target.closest('[data-mclose]')){closeM();return}if(e.target===mo)return;if(mh)mh(e);return}
 const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.ed){const[k,id]=d.ed.split(':');startEdit(k,id)}
 if(d.gen)openGen();
 if(d.add==='t'||d.add==='m'||d.add==='p')startNew(d.add);
 const stage=()=>(SDR||(SDR=S.slots.map(s=>({...s}))));
 if(d.add==='s'){stage().push({id:uid(),day:'',sh:18,sm:0,eh:19,em:30});render()}
 if(d.st){const[id,f,dl]=d.st.split(':'),s=stage().find(x=>x.id===id),mx=f[1]==='h'?24:60,step=f[1]==='h'?1:5;s[f]=((s[f]+ +dl*step)%mx+mx)%mx;render()}
 if(d.scancel){SDR=null;render()}
 if(d.sok)commitSlots();
 if(d.del){const[k,id]=d.del.split(':');if(k==='s'){SDR=stage().filter(x=>x.id!==id);render();return}
  const msg={m:'این بازی حذف شود؟',p:'این جلسه تمرین حذف شود؟',t:'تیم و همه بازی‌ها و تمرین‌هایش حذف شود؟',s:'این سانس حذف شود؟'}[k];
  confirmDel(msg,()=>{
   if(k==='m')S.matches=S.matches.filter(x=>x.id!==id);
   if(k==='p')S.practices=S.practices.filter(x=>x.id!==id);
   if(k==='s')S.slots=S.slots.filter(x=>x.id!==id);
   if(k==='t'){S.teams=S.teams.filter(x=>x.id!==id);S.matches=S.matches.filter(g=>g.a!==id&&g.b!==id);S.practices.forEach(p=>p.teams=p.teams.filter(x=>x!==id))}})}
 if(d.bk==='reset')confirmDel('همه اطلاعات (تیم‌ها، بازی‌ها، تمرینات) پاک شود؟',()=>{S=norm({})});
 if(d.imp){impK=d.imp;$('xf').click()}
 if(d.exp)xl(sheets(d.exp),`volley-${FN[d.exp]}-${ds()}.xlsx`);
 if(d.tpl)xl([{n:'قالب',h:COL[d.tpl],r:TPL[d.tpl]()}],`volley-${FN[d.tpl]}-template.xlsx`);
 if(d.bk==='exp')saveFile(new File([JSON.stringify(S)],`volley-backup-${ds()}.json`,{type:'application/json'}));
 if(d.bk==='imp')$('jf').click()});
document.addEventListener('change',e=>{const t=e.target,f=t.dataset.f;
 if(t.dataset.sd){if(!SDR)SDR=S.slots.map(s=>({...s}));SDR.find(x=>x.id===t.dataset.sd).day=t.value;render();return}
 if(!f)return;const[k]=f.split(':');
 if(k==='x'){S.need=Math.max(1,+t.value||4);save();render()}});
$('xf').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)importX(impK,f)};
$('jf').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.teams)throw 0;S=norm(d);save();render();toast('بازیابی انجام شد')}catch(x){toast('فایل پشتیبان معتبر نیست')}};r.readAsText(f)};
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
